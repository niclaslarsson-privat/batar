<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niclas båtbevakning</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0b3d5c 0%, #0e6a94 100%); color: #fff; padding: 24px;
  }
  .box { text-align: center; max-width: 560px; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 8px; }
  p.sub { opacity: 0.85; margin-bottom: 32px; }
  a.card {
    position: relative;
    display: block; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px; padding: 22px; margin-bottom: 16px; color: #fff; text-decoration: none;
    font-size: 1.2rem; font-weight: 600; transition: background 0.15s;
  }
  a.card:hover { background: rgba(255,255,255,0.2); }
  a.card small { display: block; font-weight: 400; font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
  .dot {
    position: absolute; top: 14px; right: 14px; width: 14px; height: 14px;
    background: #ff3b30; border-radius: 50%;
    box-shadow: 0 0 8px rgba(255,59,48,0.9);
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }
  .changenote {
    display: block; font-weight: 500; font-size: 0.8rem; margin-top: 8px;
    color: #ffb3ae;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>⚓ Båtbevakning</h1>
    <p class="sub">Sverige &amp; Finland · under 1,2 mkr · endast Volvo Penta D6 · uppdateras automatiskt</p>
    <a class="card" id="card-grandezza" href="grandezza.html">Grandezza 31 OC<small>aktuella annonser med prishistorik</small></a>
    <a class="card" id="card-aquador" href="aquador.html">Aquador 28 HT<small>aktuella annonser med prishistorik</small></a>
    <a class="card" id="card-kabin" href="kabin.html">Fler kabinbåtar med D6<small>Grandezza 31 DC, Nimbus m.fl. under 1,2 mkr</small></a>
  </div>
<script>
// Sätts av den automatiska uppdateringen när en båt TILLKOMMIT eller TAGITS BORT (ej prisändringar).
// stamp måste vara unik per händelse. null = ingen ohanterad förändring.
const CHANGES = {
  grandezza: { stamp: "2026-08-07-akersberga-bort", note: "Borttagen 7 aug: Åkersberga (1 150 000 kr) – troligen såld" },
  aquador:   { stamp: "2026-08-07-lidkoping-bort", note: "Borttagen 7 aug: Lidköping (1 200 000 kr) – troligen såld" },
  kabin:     null
};
for (const key of ["grandezza", "aquador", "kabin"]) {
  const ch = CHANGES[key];
  if (!ch) continue;
  let seen = null;
  try { seen = localStorage.getItem("seen_" + key); } catch (e) {}
  if (seen === ch.stamp) continue;
  const card = document.getElementById("card-" + key);
  const dot = document.createElement("span");
  dot.className = "dot";
  card.appendChild(dot);
  const note = document.createElement("span");
  note.className = "changenote";
  note.textContent = "● " + ch.note;
  card.appendChild(note);
  card.addEventListener("click", () => {
    try { localStorage.setItem("seen_" + key, ch.stamp); } catch (e) {}
  });
}
</script>
</body>
</html>
